<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dil</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; font-family: system-ui, sans-serif; }

.viewport {
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.content {
  flex: 1;
  position: relative;
}

.page {
  position: absolute;
  inset: 0;
  padding: 24px;
  overflow-y: auto;
  background: #fff;
  z-index: 0;
}
.page.active { z-index: 1; }

.tabs {
  display: flex;
  overflow-x: auto;
  scrollbar-width: none;
  border-top: 1px solid #ddd;
  background: #fafafa;
}
.tabs::-webkit-scrollbar { display: none; }

.tab {
  flex: 0 0 calc(100% / 3);
  text-align: center;
  padding: 14px 0;
  cursor: pointer;
  user-select: none;
  color: #666;
  font-size: 14px;
  transition: color 0.15s, background 0.15s;
}
.tab:hover { background: #f0f0f0; }
.tab.active { color: #000; font-weight: 600; background: #eaeaea; }

.form {
z-index: -1;
display: flex;
}

.form.active {
z-index: 2;
}

</style>
</head>
<body>

<div class="viewport">
  <div class="content">
    <div class="page active" data-index="0"><h2>Overview</h2><p>TODO</p></div>
    <div class="page" data-index="1"><table id="tab-1"></table></div>
    <div class="page" data-index="2"><table id="tab-2"></table></div>
    <div class="page" data-index="3"><table id="tab-3"></table></div>
    <div class="page" data-index="4"><table id="tab-4"></table></div>
    <div class="page" data-index="5"><table id="tab-4"></table></div>
    <div class="page form">
    <form id="form" onsubmit="return ent_add(event)">
      <label for="ent_title">Title</label><br>
      <input type="text" id="ent_title" name="ent_title"><br>
      <label for="ent_asset">Assets</label><br>
      <input type="text" id="ent_asset" name="ent_asset">
      <label for="ent_plan">Plan</label><br>
      <input type="text" id="ent_plan" name="ent_plan">
      <label for="ent_due">Due</label><br>
      <input type="text" id="ent_due" name="ent_due">
      <input type="submit" submit>
    </form>
    </div>
  </div>



  <div class="tabs">
    <div class="tab active" data-index="0">Overview</div>
    <div class="tab" data-index="1">Reminders</div>
    <div class="tab" data-index="2">Todo</div>
    <div class="tab" data-index="3">Idea</div>
    <div class="tab" data-index="4">Regrets</div>
    <div class="tab" data-index="5">Ongoing</div>
  </div>
</div>

<div onclick="addnew()" style="position: fixed; bottom: 20px; right: 20px; width: 50px; height: 50px; background: #000; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer;">+</div>

<script>
var current_page = 0
const keys = Object.keys(localStorage);
for (let key of keys) {
  const value = localStorage.getItem(key);
  ks = key.split(':')
  type = ks[0]
  id = ks[1]
  data = JSON.parse(value)
  document.getElementById("tab-" + type).innerHTML += `
  <tr>
    <td>${data.ent_title}</td>
    <td>${data.ent_due}</td>
    <td style="color: green"> &#11044 </td>
    <td> <button> del </button></td>
  </tr>
  `
}

function addnew() {
  console.log("liu")
  const forms = document.querySelectorAll('.form');
  forms.forEach(t => t.classList.toggle('active', true))
}

var form = document.getElementById("form")
const shortId = () => Math.random().toString(36).substring(2);
function ent_add(event) {
  event.preventDefault();
  const formData = new FormData(form);
  const formProps = Object.fromEntries(formData);
  v = JSON.stringify(formProps);
  k = current_page + ':' + shortId()
  localStorage.setItem(k, v)
  const forms = document.querySelectorAll('.form');
  forms.forEach(t => t.classList.toggle('active', false))
  return true
}


</script>


<script>
const tabs = document.querySelectorAll('.tab');
const pages = document.querySelectorAll('.page');

tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    const idx = tab.dataset.index;
    current_page = idx
    tabs.forEach(t => t.classList.toggle('active', t.dataset.index === idx));
    pages.forEach(p => p.classList.toggle('active', p.dataset.index === idx));
  });
});
</script>

</body>
</html>
